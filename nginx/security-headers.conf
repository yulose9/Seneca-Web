# Included in every location: nginx drops server-level add_header directives
# inside any location that declares its own.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Google sign-in uses a popup that must be able to talk back to the app
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
